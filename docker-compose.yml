services:
  skybox-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    # On a Raspberry Pi with a USB SD card reader:
    # - Add "privileged: true" OR mount specific /dev/sd* devices to enable lsblk SD detection
    # - Mount the NVMe drive so copied footage has somewhere to land
    # privileged: true
    volumes:
      # SQLite database + persistent data
      - /mnt/tank/appdata/skybox:/data
      # NVMe footage storage (Pi: adjust to your actual NVMe mount point)
      # - /mnt/nvme/skybox:/mnt/nvme/skybox
    environment:
      PORT: "3001"

      # ── Storage ────────────────────────────────────────────────────────────
      DB_PATH: /data/skybox.db
      # Root dir where footage is copied from SD cards
      # Adjust to match the volume mount above
      MEDIA_ROOT: /mnt/nvme/skybox

      # ── Nextcloud (TrueNAS at home) ────────────────────────────────────────
      NEXTCLOUD_URL: ""          # e.g. https://nextcloud.yourdomain.com
      NEXTCLOUD_USER: ""         # Nextcloud username
      NEXTCLOUD_PASSWORD: ""     # Use an app password, not your login password

      # ── Burble DZ ──────────────────────────────────────────────────────────
      DZ_ID: "2351"              # ← your DZ's Burble ID
      DZ_TZ: "Europe/Madrid"     # ← IANA timezone
      DZ_LAT: "37.16"            # ← DZ latitude
      DZ_LON: "-5.61"            # ← DZ longitude
