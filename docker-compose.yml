# TrueNAS deployment — runs the Burble scraper 24/7
# Build context is the repo root (needs access to both server/ and webapp/)
#
# Usage:
#   docker compose up -d

services:
  skybox-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      # Persistent DB storage — change to your TrueNAS dataset path
      - /mnt/tank/appdata/skybox:/data
    environment:
      PORT: "3001"
      DB_PATH: /data/skybox.db

      # No LOADS_SOURCE_URL → TrueNAS mode: runs Burble scraper, no SD handling
      # LOADS_SOURCE_URL is intentionally absent here

      # ── Burble DZ ──────────────────────────────────────────────────────────
      DZ_ID: "2351"           # ← your DZ's Burble ID
      DZ_TZ: "Europe/Madrid"  # ← IANA timezone
      DZ_LAT: "37.16"         # ← DZ latitude  (Skydive Spain, near Seville)
      DZ_LON: "-5.61"         # ← DZ longitude
